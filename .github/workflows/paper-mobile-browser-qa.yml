name: PAPER mobile browser QA
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile-paper-layout:
    name: Offline mobile layout and keyboard safety
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare free local browser QA environment
        run: |
          python3 -m venv /tmp/crypto-paper-qa-venv
          /tmp/crypto-paper-qa-venv/bin/python -m pip install --disable-pip-version-check playwright==1.55.0
          command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Audit six responsive sizes using local PAPER fixtures
        run: |
          /tmp/crypto-paper-qa-venv/bin/python -m scripts.audit_paper_dashboard_browser --out-dir paper-mobile-qa
      - name: Attach synthetic offline screenshots and JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-mobile-qa-${{ github.run_id }}
          path: paper-mobile-qa
          if-no-files-found: warn
          retention-days: 7
