name: Validate documentation and Python
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project documents
        run: python3 scripts/check_docs.py
      - name: Validate Python syntax
        run: python3 -m compileall -q crypto_intelligence_agent tests
      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -v
