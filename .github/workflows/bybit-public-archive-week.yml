name: J1 historical Bybit seven-day owner-only probe
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: j1-bybit-week-research
  cancel-in-progress: false
jobs:
  week-once:
    if: >-
      github.event.issue.number == 250 &&
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/probe-bybit-week-once-v1' &&
      github.event.comment.user.login == 'leandrosilveiradepaula' &&
      github.actor == 'leandrosilveiradepaula'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout reviewed main without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read seven fixed archive days into RAM only
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -eu
          python3 -m scripts.probe_bybit_archive_week \
            --allow-public-network --allow-weekly-archive-probe
